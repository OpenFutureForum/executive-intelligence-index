<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local OEII review</title><style>body{font:16px/1.5 system-ui;max-width:900px;margin:3rem auto;padding:0 1rem}pre{white-space:pre-wrap;background:#f2f4f2;padding:1rem;border:1px solid #ccd3ce}label{font-weight:700;display:block;margin:.8rem 0}.warning{border-left:4px solid #b25b00;padding:1rem;background:#fff6e8}</style></head><body><h1>Local review interface</h1><p class="warning">Files stay in this browser. Do not load private, confidential, or unlicensed source text.</p><label for="record">Select a generated review packet or proposed JSON record</label><input id="record" type="file" accept="application/json,.json"><h2>Proposed record</h2><pre id="output">No local file selected.</pre><label for="decision">Reviewer decision</label><select id="decision"><option>pending</option><option>changes_requested</option><option>approved</option><option>rejected</option></select><p>Record the decision through the repository review workflow; this local page does not write files.</p><script>document.querySelector('#record').addEventListener('change',async(e)=>{const f=e.target.files[0];if(!f)return;try{document.querySelector('#output').textContent=JSON.stringify(JSON.parse(await f.text()),null,2)}catch{document.querySelector('#output').textContent='Invalid JSON.'}})</script></body></html>
