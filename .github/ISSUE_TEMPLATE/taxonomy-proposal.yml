name: "Taxonomy proposal"
description: "Submit one evidence-backed taxonomy proposal for editorial review."
title: "Taxonomy proposal: "
labels: [taxonomy]
body:
  - type: markdown
    attributes:
      value: "Submission does not guarantee inclusion. Do not include private source material, personal contact details, or copyrighted full text."
  - type: textarea
    id: field_1
    attributes:
      label: "Proposed preferred label"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Definition and exclusions"
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: "Parent topic"
    validations:
      required: true
  - type: textarea
    id: field_4
    attributes:
      label: "Aliases and examples"
    validations:
      required: true
  - type: textarea
    id: field_5
    attributes:
      label: "Evidence of durable distinction"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have provided public evidence and disclosed relevant relationships.
          required: true
