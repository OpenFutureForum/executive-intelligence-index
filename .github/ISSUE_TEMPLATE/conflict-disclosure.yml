name: "Sponsorship or conflict disclosure"
description: "Submit one evidence-backed sponsorship or conflict disclosure for editorial review."
title: "Sponsorship or conflict disclosure: "
labels: [disclosure]
body:
  - type: markdown
    attributes:
      value: "Submission does not guarantee inclusion. Do not include private source material, personal contact details, or copyrighted full text."
  - type: textarea
    id: field_1
    attributes:
      label: "Affected person, source, or dossier"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Relationship"
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: "Relevant dates"
    validations:
      required: true
  - type: textarea
    id: field_4
    attributes:
      label: "Potential effect"
    validations:
      required: true
  - type: textarea
    id: field_5
    attributes:
      label: "Proposed disclosure text"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have provided public evidence and disclosed relevant relationships.
          required: true
