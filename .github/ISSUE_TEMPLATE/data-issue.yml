name: "Data issue"
description: "Submit one evidence-backed data issue for editorial review."
title: "Data issue: "
labels: [data]
body:
  - type: markdown
    attributes:
      value: "Submission does not guarantee inclusion. Do not include private source material, personal contact details, or copyrighted full text."
  - type: textarea
    id: field_1
    attributes:
      label: "Record ID or export"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Observed problem"
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: "Expected behavior or value"
    validations:
      required: true
  - type: textarea
    id: field_4
    attributes:
      label: "Evidence"
    validations:
      required: true
  - type: textarea
    id: field_5
    attributes:
      label: "Affected release"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have provided public evidence and disclosed relevant relationships.
          required: true
