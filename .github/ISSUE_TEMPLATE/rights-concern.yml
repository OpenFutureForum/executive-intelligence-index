name: "Rights concern"
description: "Submit one evidence-backed rights concern for editorial review."
title: "Rights concern: "
labels: [rights]
body:
  - type: markdown
    attributes:
      value: "Submission does not guarantee inclusion. Do not include private source material, personal contact details, or copyrighted full text."
  - type: textarea
    id: field_1
    attributes:
      label: "Affected record or URL"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Rights holder or relationship"
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: "Material at issue"
    validations:
      required: true
  - type: textarea
    id: field_4
    attributes:
      label: "Reason for concern"
    validations:
      required: true
  - type: textarea
    id: field_5
    attributes:
      label: "Requested review action"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have provided public evidence and disclosed relevant relationships.
          required: true
