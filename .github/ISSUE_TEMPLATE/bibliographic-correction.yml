name: "Bibliographic correction"
description: "Submit one evidence-backed bibliographic correction for editorial review."
title: "Bibliographic correction: "
labels: [correction]
body:
  - type: markdown
    attributes:
      value: "Submission does not guarantee inclusion. Do not include private source material, personal contact details, or copyrighted full text."
  - type: textarea
    id: field_1
    attributes:
      label: "Work or edition ID"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Field to correct"
    validations:
      required: true
  - type: textarea
    id: field_3
    attributes:
      label: "Proposed value"
    validations:
      required: true
  - type: textarea
    id: field_4
    attributes:
      label: "Bibliographic source"
    validations:
      required: true
  - type: textarea
    id: field_5
    attributes:
      label: "Edition-specific notes"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I have provided public evidence and disclosed relevant relationships.
          required: true
